<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uShade - Privacy Streaming</title>
    <style>
        /* Pure Dark Mode Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* App Header */
        header {
            background-color: #0a0a0a;
            border-bottom: 2px solid #1a1a1a;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        h1 {
            color: #bf55ec; /* uShade Purple */
            margin: 0;
            font-size: 1.5rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        /* Custom Search Box */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #222;
            border-radius: 25px;
            background-color: #121212;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #bf55ec;
        }
        button {
            padding: 12px 25px;
            font-size: 1rem;
            background-color: #bf55ec;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #a439d1;
        }
        
        /* Theater Player Container */
        #player-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0px 10px 40px rgba(191, 85, 236, 0.25);
        }
        .close-btn {
            margin-top: 15px;
            background-color: #333;
        }

        /* Video Feed Grid Layout */
        .section-title {
            text-align: left;
            color: #bf55ec;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid #bf55ec;
            padding-left: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            text-align: left;
        }
        .video-card {
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .video-card:hover {
            transform: translateY(-5px);
            border-color: #bf55ec;
        }
        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3rem;
            color: #fff;
        }
        .video-author {
            font-size: 0.8rem;
            color: #888;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="location.reload()">
            <h1>uShade</h1>
        </div>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Search for ad-free videos...">
            <button onclick="executeSearch()">Search</button>
        </div>

        <div id="player-container">
            <div class="iframe-wrapper">
                <div id="player-target"></div>
            </div>
            <button class="close-btn" onclick="closePlayer()">Close Player</button>
        </div>

        <h2 class="section-title" id="feedTitle">Recommended Videos</h2>
        <div class="video-grid" id="contentGrid"></div>
    </div>

    <script>
        // Use a bulletproof, high-speed open search engine script configuration
        window.onload = function() {
            // Load a default set of clean music/videos on startup so it's never blank
            executeDefaultFeed();
            
            document.getElementById('searchQuery').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') executeSearch();
            });
        };

        async function executeDefaultFeed() {
            // High speed layout initialization sequence
            const queries = ['trending music', 'gaming mixes', 'lofi beats'];
            const fallbackQuery = queries[Math.floor(Math.random() * queries.length)];
            fetchSearchResults(fallbackQuery);
        }

        async function executeSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;

            // Instantly bypass if user pastes a direct video url link
            if (query.includes("youtu.be/") || query.includes("v=")) {
                let directId = "";
                if (query.includes("v=")) directId = query.split("v=")[1].split("&")[0];
                else directId = query.split("youtu.be/")[1].split("?")[0];
                launchCleanStream(directId);
                return;
            }

            document.getElementById('feedTitle').innerText = `Results for: "${query}"`;
            fetchSearchResults(query);
        }

        // Direct No-Block Content Scraper Engine
        async function fetchSearchResults(keyword) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "<p style='grid-column:1/-1; color:#888;'>Searching database safely...</p>";
            
            try {
                // Connects directly via search proxy tunnel that can't be blocked by privacy nodes
                const res = await fetch(`https://images${Math.floor(Math.random() * 3) + 1}-focus-opensocial.googleusercontent.com/gadgets/proxy?container=none&url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + encodeURIComponent(keyword))}`);
                const html = await res.text();
                
                // Track down the video metadata inside the raw structure
                const match = html.match(/ytInitialData\s*=\s*({.+?});/);
                if (!match) throw new Error("Parse error");
                
                const data = JSON.parse(match[1]);
                const contents = data.contents.twoColumnSearchResultsRenderer.primaryContents.sectionListRenderer.contents[0].itemSectionRenderer.contents;
                
                grid.innerHTML = ""; // Wipe screen layout clear safely
                let count = 0;

                contents.forEach(item => {
                    if (item.videoRenderer && count < 12) {
                        const video = item.videoRenderer;
                        const videoId = video.videoId;
                        const title = video.title.runs[0].text;
                        const author = video.ownerText.runs[0].text;
                        const thumbUrl = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
                        
                        count++;
                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.onclick = () => launchCleanStream(videoId);
                        
                        card.innerHTML = `
                            <div class="thumbnail-box">
                                <img src="${thumbUrl}" alt="Thumbnail">
                            </div>
                            <div class="video-info">
                                <p class="video-title">${title}</p>
                                <p class="video-author">${author}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                });
                
                if (count === 0) showEmptyState();
            } catch (err) {
                console.error(err);
                showEmptyState();
            }
        }

        function showEmptyState() {
            document.getElementById('contentGrid').innerHTML = `
                <div style="grid-column: 1/-1; padding: 30px; background: #0a0a0a; border: 1px dashed #333; border-radius:12px;">
                    <p style="color:#aaa;">Search channel is busy right now.</p>
                    <p style="font-size:0.9rem; color:#666;">Type an exact YouTube video link right into the bar above to launch it instantly!</p>
                </div>`;
        }

        // Click to Play Launcher Execution Block
        function launchCleanStream(id) {
