<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uShade - Privacy Streaming</title>
    <style>
        /* Modern Dark Mode Settings */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        
        /* Fixed Navigation Header */
        header {
            background-color: #0a0a0a;
            border-bottom: 2px solid #1a1a1a;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .app-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }
        h1 {
            color: #bf55ec; /* uShade Purple */
            margin: 0;
            font-size: 1.5rem;
        }
        
        /* Layout Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        /* Native Search Controls */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        input[type="text"] {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #222;
            border-radius: 25px;
            background-color: #121212;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #bf55ec;
        }
        button {
            padding: 12px 25px;
            font-size: 1rem;
            background-color: #bf55ec;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #a439d1;
        }
        
        /* Video Screen View */
        #player-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #222;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            max-width: 854px;
            aspect-ratio: 16 / 9;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0px 10px 40px rgba(191, 85, 236, 0.25);
        }
        .close-btn {
            margin-top: 15px;
            background-color: #333;
        }

        /* Video Grid UI */
        .section-title {
            text-align: left;
            color: #bf55ec;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-left: 4px solid #bf55ec;
            padding-left: 10px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            text-align: left;
        }
        .video-card {
            background-color: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .video-card:hover {
            transform: translateY(-5px);
            border-color: #bf55ec;
        }
        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
        }
        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-info {
            padding: 12px;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3rem;
            color: #fff;
        }
        .video-author {
            font-size: 0.8rem;
            color: #888;
            margin: 0;
        }
        
        /* Spinner */
        .loader {
            display: none;
            margin: 40px auto;
            border: 4px solid #111;
            border-top: 4px solid #bf55ec;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="loadTrendingPage()">
            <img src="logo.png" alt="uShade Logo" class="app-logo" onerror="this.style.display='none'">
            <h1>uShade</h1>
        </div>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Search or paste a YouTube URL...">
            <button onclick="executeSearch()">Search</button>
        </div>

        <div id="player-container">
            <div class="iframe-wrapper">
                <div id="player-target"></div>
            </div>
            <button class="close-btn" onclick="closePlayer()">Close Player</button>
        </div>

        <div class="loader" id="appLoader"></div>

        <h2 class="section-title" id="feedTitle">Trending Videos</h2>
        <div class="video-grid" id="contentGrid"></div>
    </div>

    <script>
        // High-availability routing instances updated for late 2026 stability
        const apiInstances = [
            "https://inv.thepixora.com",
            "https://invidious.asir.dev",
            "https://invidious.projectsegfau.lt"
        ];
        let currentApiIndex = 0;

        window.onload = function() {
            loadTrendingPage();
            document.getElementById('searchQuery').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') executeSearch();
            });
        };

        // Network Fetch Engine with Silent Failovers
        async function fetchApiData(endpoint) {
            document.getElementById('appLoader').style.display = 'block';
            
            for (let attempts = 0; attempts < apiInstances.length; attempts++) {
                const activeBase = apiInstances[currentApiIndex];
                try {
                    // Set a strict 5-second timeout so it doesn't leave you hanging
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const response = await fetch(`${activeBase}/api/v1/${endpoint}`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error("Server error");
                    const data = await response.json();
                    document.getElementById('appLoader').style.display = 'none';
                    return data;
                } catch (err) {
                    console.warn(`Node failed: ${activeBase}. Checking backup...`);
                    // Instantly shift to the next backup instance in line
                    currentApiIndex = (currentApiIndex + 1) % apiInstances.length;
                }
            }
            document.getElementById('appLoader').style.display = 'none';
            return null; // Return empty instead of blowing up the screen with alert boxes
        }

        async function loadTrendingPage() {
            document.getElementById('feedTitle').innerText = "Trending Videos";
            const data = await fetchApiData("trending?region=GB");
            if (data) {
                renderVideoGrid(data);
            } else {
                showOfflineFallback();
            }
        }

        async function executeSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return;

            // Direct URL Input Auto-Bypass
            if (query.includes("youtu.be/") || query.includes("v=") || query.includes("embed/")) {
                let directId = "";
                if (query.includes("v=")) directId = query.split("v=")[1].split("&")[0];
                else if (query.includes("youtu.be/")) directId = query.split("youtu.be/")[1].split("?")[0];
                else directId = query.split("embed/")[1].split("?")[0];
                launchCleanStream(directId);
                return;
            }

            document.getElementById('feedTitle').innerText = `Results for: "${query}"`;
            const data = await fetchApiData(`search?q=${encodeURIComponent(query)}&type=video`);
            if (data) {
                renderVideoGrid(data);
            } else {
                // If API is blocked, automatically turn search into a direct playback engine
                document.getElementById('contentGrid').innerHTML = `
                    <div style="grid-column: 1/-1; padding: 20px; background:#0a0a0a; border-radius:12px; border:1px solid #bf55ec;">
                        <p style="margin:0 0 10px 0;">API nodes are heavily loaded right now.</p>
                        <button onclick="launchCleanStream('${encodeURIComponent(query)}')">Force Load Video ID "${query}" Directly</button>
                    </div>`;
            }
        }

        function renderVideoGrid(videos) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = "";

            videos.forEach(video => {
                let thumbUrl = video.videoThumbnails && video.videoThumbnails.length > 0
                    ? video.videoThumbnails.find(t => t.quality === "medium")?.url || video.videoThumbnails[0].url
                    : `https://img.youtube.com/vi/${video.videoId}/mqdefault.jpg`;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => launchCleanStream(video.videoId);
                
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${thumbUrl}" alt="Thumbnail" loading="lazy">
                    </div>
                    <div class="video-info">
                        <p class="video-title">${video.title}</p>
                        <p class="video-author">${video.author}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showOfflineFallback() {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = `
                <div style="grid-column: 1/-1; padding: 40px 20px; background: #0a0a0a; border: 1px dashed #333; border-radius: 12px;">
                    <p style="color: #aaa; margin-bottom: 15px;">Public API feeds are currently updating links.</p>
                    <p style="font-size: 0.9rem; color: #888;">You can still paste any YouTube link or exact Video ID into the search bar above to stream instantly!</p>
                </div>`;
        }

        function launchCleanStream(id) {
            const playerContainer = document.getElementById('player-container');
            const playerTarget = document.getElementById('player-target');
            
            // Uses standard base fallback embedder routing
            playerTarget.innerHTML = `
                <iframe 
                    src="https://invidious.f5.si/embed/${id}?autoplay=1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>`;
            
            playerContainer.style.display = 'flex';
            window.scrollTo({ top: playerContainer.offsetTop - 100, behavior: 'smooth' });
        }

        function closePlayer() {
            document.getElementById('player-container').style.display = 'none';
            document.getElementById('player-target').innerHTML = "";
        }
    </script>
</body>
</html>
