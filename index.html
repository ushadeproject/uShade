<html lang="en">

        body {

            padding: 0;

        /* Fixed Navigation Header */
        header {

            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;

        /* Universal Layout Container */
        .container {

            padding: 0 20px;

        /* Native Search Controls */
        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

            background-color: #121212;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #bf55ec;
        }

            color: white;

            border-radius: 25px;

            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #a439d1;
        }

            border: 1px solid #222;
